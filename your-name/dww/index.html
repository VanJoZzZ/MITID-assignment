<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penalty Mind Games</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>

    <!-- 第一页：标题和选队 -->
    <section id="homePage" class="page">
        <h1>PENALTY <span>MIND GAMES</span></h1>

        <div class="team-selection">
            <div class="team-box">
                <h2>PLAYER 1</h2>
                <img id="crestA" class="crest" alt="Team 1 crest">
                <select id="teamA"></select>
            </div>

            <h2>VS</h2>

            <div class="team-box">
                <h2>PLAYER 2</h2>
                <img id="crestB" class="crest" alt="Team 2 crest">
                <select id="teamB"></select>
            </div>
        </div>

        <button id="startButton">START MATCH</button>
        <p id="teamMessage"></p>
    </section>

    <!-- 第二页：左边球场，右边硬件数据 -->
    <section id="gamePage" class="page">
        <header>
            <h2>PENALTY MIND GAMES</h2>
            <button id="backButton">CHANGE TEAMS</button>
        </header>

        <div class="match-layout">
            <div class="left-panel">
                <div class="scoreboard">
                    <img id="matchCrestA" alt="Team 1 crest">
                    <span id="nameA">Team A</span>
                    <strong id="score">0 - 0</strong>
                    <span id="nameB">Team B</span>
                    <img id="matchCrestB" alt="Team 2 crest">
                </div>
                <div id="pitch"></div>

                <div class="match-info">
                    <strong id="shotNumber">Penalty 1 / 10</strong>
                    <span id="resultText">Ready to shoot</span>
                </div>

                <button id="standingsButton">LEAGUE TABLE</button>
                <button id="restartButton">NEW MATCH</button>
            </div>

            <div class="right-panel">
                <h2>LIVE CONTROL DATA</h2>

                <h3>SHOOTER</h3>
                <p>Aim <strong id="aimData">90°</strong></p>
                <input id="aimBar" type="range" min="0" max="180" value="90" disabled>

                <p>Power <strong id="powerData">60%</strong></p>
                <input id="powerBar" type="range" min="0" max="100" value="60" disabled>

                <p>Shoot <strong id="shootData">0</strong></p>
                <p>Landing <strong id="targetData">ON TARGET</strong></p>

                <h3>GOALKEEPER</h3>
                <p>Move <strong id="moveData">50%</strong></p>
                <input id="moveBar" type="range" min="0" max="100" value="50" disabled>

                <p>Jump Height <strong id="heightData">50%</strong></p>
                <input id="heightBar" type="range" min="0" max="100" value="50" disabled>

                <p>Jump <strong id="jumpData">0</strong></p>

                <button id="connectButton">CONNECT ARDUINO</button>
                <p id="serialStatus">Not connected</p>
            </div>
        </div>
    </section>

    <!-- 第三页：积分榜 -->
    <section id="leaguePage" class="page">
        <header>
            <h2>LEAGUE TABLE</h2>
            <button id="leagueBackButton">BACK TO MATCH</button>
        </header>

        <table>
            <thead>
                <tr>
                    <th>Team</th>
                    <th>P</th>
                    <th>W</th>
                    <th>D</th>
                    <th>L</th>
                    <th>GD</th>
                    <th>Pts</th>
                </tr>
            </thead>
            <tbody id="leagueBody"></tbody>
        </table>
    </section>

    <audio id="goalSound" src="assets/siuuu.mp3" preload="auto"></audio>
</body>
</html>
